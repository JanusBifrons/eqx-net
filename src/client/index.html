<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070f" />
    <!-- The web manifest <link> is injected by vite-plugin-pwa (manifest.webmanifest). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>EQX Peri</title>
    <style>
      :root {
        /* Fixed AppHeader height. Slot anchors padded with this so HUD widgets
           never paint underneath the header. The header is hidden on touch
           devices (`pointer: coarse`) regardless of viewport width — phones
           in landscape are 667+ px wide so a width-based breakpoint would
           leave the AppBar visible there. */
        --app-bar-h: 48px;
        /* Edge inset applied by the bottom-left/bottom-right anchor hosts
           (joystick + fire/boost). 16 px is the comfortable default; on a
           phone in landscape the user's grip naturally curls inward, so the
           media query below kicks the controls further from the bezel. */
        --mobile-edge-inset: 16px;
      }
      @media (pointer: coarse) {
        :root { --app-bar-h: 0px; }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        :root { --mobile-edge-inset: 40px; }
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000;
        color: #eee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        /* P6.2: suppress the Android long-press text-selection gesture (and its
           OS haptic) so click-and-hold during structure placement doesn't
           vibrate / hijack the touch sequence. Paired with the contextmenu
           handler that no longer cancels placement on a touch long-press. */
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* Cinematic HUD modes (src/client/cinematic/hudMode.ts) — `?cinematic=1`
         / `?hud=clean|minimal|none`, or `__eqxCinema.setHud()` mid-capture. The
         transit + fullscreen anchors (warp overlay, load curtain) stay visible. */
      html.eqx-hud-clean [data-testid="app-header"],
      html.eqx-hud-clean [data-testid="sector-info-panel"],
      html.eqx-hud-clean [data-testid="pilot-spectator-toggle"],
      html.eqx-hud-clean [data-testid="warp-warning-idle"],
      html.eqx-hud-clean [data-testid="single-player-button"],
      html.eqx-hud-clean [data-testid="engineering-rooms-button"],
      html.eqx-hud-minimal [data-testid="single-player-button"],
      html.eqx-hud-minimal [data-testid="engineering-rooms-button"],
      html.eqx-hud-none [data-testid="single-player-button"],
      html.eqx-hud-none [data-testid="engineering-rooms-button"],
      html.eqx-hud-minimal [data-testid="sector-info-panel"],
      html.eqx-hud-minimal [data-testid="pilot-spectator-toggle"],
      html.eqx-hud-minimal [data-testid="warp-warning-idle"],
      html.eqx-hud-minimal [data-testid="app-header"],
      html.eqx-hud-minimal [data-anchor="top-right"],
      html.eqx-hud-minimal [data-anchor^="middle-"],
      html.eqx-hud-minimal [data-anchor^="bottom-"],
      html.eqx-hud-none [data-testid="app-header"],
      html.eqx-hud-none [data-anchor^="top-"],
      html.eqx-hud-none [data-anchor^="middle-"],
      html.eqx-hud-none [data-anchor^="bottom-"],
      /* Fire-control lock banner ("N SHIPS HAVE YOU LOCKED"): full HUD only
         (`lockOverlaysVisible` in hudMode.ts; the world lock marks follow it). */
      html.eqx-hud-clean [data-testid="fc-lock-band"],
      html.eqx-hud-minimal [data-testid="fc-lock-band"],
      html.eqx-hud-none [data-testid="fc-lock-band"] {
        visibility: hidden !important;
      }
      /* In-game HUD: the idle "Nothing incoming" chip goes — only real threats show. */
      html.eqx-game-hud [data-testid="warp-warning-idle"] { display: none !important; }
      /* Invisible oversize hit area for small round controls (HoldButton). */
      .eqx-holdbtn::before {
        content: '';
        position: absolute;
        inset: calc(-1 * var(--slop, 0px));
        border-radius: 50%;
      }
      .eqx-holdbtn[data-pressed='1'] { transform: scale(0.94); filter: brightness(1.35); }
      html.eqx-game-hud.eqx-hud-minimal [data-hud-exclusion],
      html.eqx-game-hud.eqx-hud-none [data-hud-exclusion] { visibility: hidden !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Ship scale (R&D / tuning): read before any module loads, so the ship
         catalogue is built at the right scale. Must match the server's
         EQX_SHIP_SCALE / EQX_SHIP_TUNING (the welcome checks it). -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.has('shipScale')) window.__EQX_SHIP_SCALE__ = q.get('shipScale');
        if (q.has('shipTuning')) window.__EQX_SHIP_TUNING__ = q.get('shipTuning');
        if (q.has('shipKindScale')) window.__EQX_SHIP_KIND_SCALE__ = q.get('shipKindScale');
        if (q.has('capStyle')) window.__EQX_CAPITAL_STYLE__ = q.get('capStyle');
        if (q.has('capMap')) window.__EQX_CAPITAL_MAP__ = q.get('capMap');
        if (q.has('sectorScale')) window.__EQX_SECTOR_SCALE__ = q.get('sectorScale');
        if (q.has('solar')) window.__EQX_SOLAR_SECTORS__ = q.get('solar');
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
